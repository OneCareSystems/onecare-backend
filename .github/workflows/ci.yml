name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

# Least privilege for the default token; the workflow never pushes or deploys.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_CLI_OPTS: -B -ntp

jobs:
  # -------------------------------------------------------------------
  # Stage A - lint: Checkstyle for the backend
  # -------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Checkstyle lint
        run: ./mvnw $MAVEN_CLI_OPTS checkstyle:check

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Stage B - static analysis on every build:
  # SpotBugs bytecode analysis. SonarQube is deliberately substituted
  # -------------------------------------------------------------------
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: SpotBugs static analysis
        run: ./mvnw $MAVEN_CLI_OPTS compile spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Stage C - security on every build:
  #   1. secret scanning of the working tree (gitleaks + .gitleaks.toml),
  #   2. GitHub dependency review on pull requests (GitHub Advisory DB),
  #   3. OWASP Dependency-Check: fails on any vulnerability with
  #      CVSS >= 7 (high/critical).
  # GitHub's native secret scanning / push protection is enabled in the
  # repository settings and complements this job.
  # -------------------------------------------------------------------
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          # Exits non-zero (default --exit-code 1) when any plaintext
          # credential is found: the job fails and the PR stays blocked.
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . --no-banner --redact

      - name: Dependency review (GitHub Advisory DB, pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.owasp-dependency-check
          key: owasp-dependency-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            owasp-dependency-check-${{ runner.os }}-

      - name: OWASP Dependency-Check
        env:
          # Optional: an NVD API key (GitHub Secret) speeds the NVD update
          # up considerably. The scan still runs without it.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            EXTRA_ARGS="-DnvdApiKey=$NVD_API_KEY"
          fi
          ./mvnw $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:12.1.3:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML \
            -DdataDirectory="$HOME/.owasp-dependency-check" \
            $EXTRA_ARGS

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Stage D - build: compile + package. Tests run in their own stage.
  # -------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build jar (tests run in the test stage)
        run: ./mvnw $MAVEN_CLI_OPTS -DskipTests package

      - name: Upload bootable jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error

  # -------------------------------------------------------------------
  # Stage E - test: unit + integration tests against the test database
  # (MySQL 8.4 service container, schema from schema.sql).
  # -------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: testdb
          MYSQL_USER: ${{ secrets.CI_MYSQL_USER || 'test' }}
          MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'test' }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || 'root' }}
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests with coverage
        run: ./mvnw $MAVEN_CLI_OPTS clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: ${{ secrets.CI_MYSQL_USER || 'test' }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || 'test' }}
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_SQL_INIT_MODE: always
          SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:schema.sql
          # Schema only: tests build their own fixtures and assert on empty
          # tables, so data.sql (local scenario seeds) must NOT load in CI.
          SPRING_SQL_INIT_DATA_LOCATIONS: classpath:ci/no-seed-data.sql
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRY: 1800000
          JWT_REFRESH_TOKEN_EXPIRY: 604800000
          SPRING_MAIL_HOST: smtp.gmail.com
          SPRING_MAIL_PORT: 587
          SPRING_MAIL_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PASSWORD_RESET_FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: 15
          BILLING_CONSULTATION_FEE: 500.00

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload OpenAPI document artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-doc
          path: target/openapi/openapi.json
          if-no-files-found: error

      - name: Upload coverage data for the coverage-gate stage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            target/jacoco.exec
            target/classes
          retention-days: 1

  # -------------------------------------------------------------------
  # Stage F - coverage gate: Enforces overall coverage >= 70%
  # -------------------------------------------------------------------
  coverage-gate:
    name: coverage-gate
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'maven'

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Download coverage data from the test stage
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: target

      - name: Generate coverage report
        run: ./mvnw $MAVEN_CLI_OPTS jacoco:report

      - name: Enforce overall coverage >= 70% (NFRM-003, DDP-27)
        run: ./mvnw $MAVEN_CLI_OPTS jacoco:check -Dcoverage.gate.minimum=0.70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Stage G - containerization: build the backend Docker image
  # -------------------------------------------------------------------
  docker-build:
    name: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build --tag "onecare-backend:${{ github.sha }}" .

      - name: Show image summary
        run: docker images --filter=reference='onecare-backend' --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  # -------------------------------------------------------------------
  # Aggregate gate: merge-blocking check ensuring all stages pass
  # -------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - lint
      - static-analysis
      - security-scan
      - build
      - test
      - coverage-gate
      - docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Require every CI stage to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs['static-analysis'].result }}
          SECURITY_SCAN_RESULT: ${{ needs['security-scan'].result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_GATE_RESULT: ${{ needs['coverage-gate'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
        run: |
          fail=0
          report() {
            if [ "$2" != "success" ]; then
              echo "::error::CI stage '$1' did not succeed (result: $2) - the pull request is blocked until it passes"
              fail=1
            fi
          }
          report lint "$LINT_RESULT"
          report static-analysis "$STATIC_ANALYSIS_RESULT"
          report security-scan "$SECURITY_SCAN_RESULT"
          report build "$BUILD_RESULT"
          report test "$TEST_RESULT"
          report coverage-gate "$COVERAGE_GATE_RESULT"
          report docker-build "$DOCKER_BUILD_RESULT"
          exit $fail