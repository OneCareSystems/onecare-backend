name: Backend CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_CLI_OPTS: -B -ntp

jobs:
  # -------------------------------------------------------------------
  # Stage A - lint: Checkstyle for the backend
  # -------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Checkstyle lint
        run: ./mvnw $MAVEN_CLI_OPTS checkstyle:check

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------
  # Stage B - static analysis: SpotBugs bytecode analysis.
  # -------------------------------------------------------------------
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: SpotBugs static analysis
        run: ./mvnw $MAVEN_CLI_OPTS compile spotbugs:check

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------
  # Stage C - security on every build:
  #   1. secret scanning of the working tree (gitleaks, explicit config),
  #   2. GitHub dependency review on pull requests (GitHub Advisory DB),
  #   3. OWASP Dependency-Check: fails on any CVSS >= 7 vulnerability.
  #
  # Branch-aware NVD key policy:
  #   main (push or PR target):
  #     NVD_API_KEY is REQUIRED. Missing key -> preflight fails -> job
  #     fails -> ci-gate blocks. Scan always runs and is enforced.
  #   develop (push or PR target):
  #     NVD_API_KEY is OPTIONAL. When present -> scan runs, enforced.
  #     When absent  -> preflight is a no-op, the scan step is skipped,
  #     the job SUCCEEDS, and the merge is NOT blocked. gitleaks and
  #     dependency-review still run and are still enforced.
  #   Other branches:
  #     NVD key optional; scan runs only when the key is present.
  # -------------------------------------------------------------------
  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      pull-requests: read

    outputs:
      nvd-key-present: ${{ steps.preflight.outputs.key_present }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Preflight - resolve NVD key policy for this ref
        id: preflight
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # base_ref is set on pull_request events; ref_name on push.
          # For pull_request, we care about the TARGET branch (base_ref).
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          key_present="false"
          if [ -n "$NVD_API_KEY" ]; then
            key_present="true"
          fi
          echo "key_present=$key_present" >> "$GITHUB_OUTPUT"
          echo "Target branch: $TARGET_BRANCH, NVD key present: $key_present"

          case "$TARGET_BRANCH" in
            main)
              # main is strict: a missing key is a hard failure.
              if [ "$key_present" != "true" ]; then
                echo "::error::NVD_API_KEY is required for 'main' but is not configured. Add the secret (Settings -> Secrets and variables -> Actions) and re-run; the merge stays blocked until the dependency scan can run."
                exit 1
              fi
              ;;
            develop)
              # develop is lenient: a missing key is informational only.
              # The scan step below will be skipped, the job succeeds,
              # and the merge is NOT blocked.
              if [ "$key_present" != "true" ]; then
                echo "::notice::NVD_API_KEY not configured; OWASP Dependency-Check is skipped for 'develop' and the merge is NOT blocked. gitleaks and dependency-review still run. Add the secret to enable the full scan."
              fi
              ;;
            *)
              echo "::notice::Branch '$TARGET_BRANCH' is not a protected branch; the NVD key is optional here."
              ;;
          esac

      - name: Secret scanning (gitleaks)
        run: |
          GITLEAKS_VERSION=8.30.1
          TARBALL="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$TARBALL" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/gitleaks"
          CONFIG_ARG=""
          if [ -f .gitleaks.toml ]; then
            CONFIG_ARG="--config .gitleaks.toml"
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" dir . $CONFIG_ARG --no-banner --redact

      - name: Dependency review (GitHub Advisory DB, pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Cache OWASP Dependency-Check data
        if: steps.preflight.outputs.key_present == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.owasp-dependency-check
          key: owasp-dependency-check-${{ runner.os }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            owasp-dependency-check-${{ runner.os }}-${{ github.job }}-
            owasp-dependency-check-${{ runner.os }}-

      # Runs only when the preflight resolved a key. Always enforced
      # when it runs: no continue-on-error, failBuildOnCVSS=7.
      - name: OWASP Dependency-Check
        if: steps.preflight.outputs.key_present == 'true'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw $MAVEN_CLI_OPTS org.owasp:dependency-check-maven:12.1.3:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML \
            -DdataDirectory="$HOME/.owasp-dependency-check" \
            -DnvdApiKey="$NVD_API_KEY"

      - name: Upload dependency-check report
        if: always() && steps.preflight.outputs.key_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------
  # Stage D - build: compile + package. Tests run in their own stage.
  # -------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build jar (tests run in the test stage)
        run: ./mvnw $MAVEN_CLI_OPTS -DskipTests package

      - name: Upload bootable jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  # -------------------------------------------------------------------
  # Stage E - test: unit + integration tests against MySQL 8.4.
  # Secrets are unavailable on fork PRs; fallbacks keep the stage runnable.
  # -------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: testdb
          MYSQL_USER: test
          MYSQL_PASSWORD: test
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run tests with coverage
        run: ./mvnw $MAVEN_CLI_OPTS clean test
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: test
          SPRING_DATASOURCE_PASSWORD: test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.MySQLDialect
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_SQL_INIT_MODE: always
          SPRING_SQL_INIT_SCHEMA_LOCATIONS: classpath:schema.sql
          # Schema only: tests build their own fixtures and assert on empty
          # tables, so data.sql (local scenario seeds) must NOT load in CI.
          SPRING_SQL_INIT_DATA_LOCATIONS: classpath:ci/no-seed-data.sql
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_EXPIRY: 1800000
          JWT_REFRESH_TOKEN_EXPIRY: 604800000
          SPRING_MAIL_HOST: smtp.gmail.com
          SPRING_MAIL_PORT: 587
          SPRING_MAIL_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          PASSWORD_RESET_FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES: 15
          BILLING_CONSULTATION_FEE: 500.00

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload OpenAPI document artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-doc
          path: target/openapi/openapi.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage data for the coverage-gate stage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            target/jacoco.exec
            target/classes
          retention-days: 1

  # -------------------------------------------------------------------
  # Stage F - coverage gate: Enforces overall coverage >= 70%
  # -------------------------------------------------------------------
  coverage-gate:
    name: coverage-gate
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Download coverage data from the test stage
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: target

      - name: Generate coverage report (no recompile)
        run: ./mvnw $MAVEN_CLI_OPTS jacoco:report -Dmaven.main.skip=true -Dmaven.test.skip=true

      - name: Enforce overall coverage >= 70% (NFRM-003, DDP-27)
        run: ./mvnw $MAVEN_CLI_OPTS jacoco:check -Dcoverage.gate.minimum=0.70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------
  # Stage G - containerization: build image from the tested jar.
  # -------------------------------------------------------------------
  docker-build:
    name: docker-build
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download bootable jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: onecare-backend:${{ github.sha }}
          build-args: |
            JAR_FILE=target/*.jar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image summary
        run: docker images --filter=reference='onecare-backend' --format '{{.Repository}}:{{.Tag}} {{.Size}}'

  # -------------------------------------------------------------------
  # Aggregate gate: merge-blocking check.
  #
  # security-scan only fails on protected branches when the policy says
  # it should:
  #   - main  + missing key   -> job fails -> gate blocks
  #   - develop + missing key -> job succeeds -> gate passes
  # The scan itself, when it runs, is always enforced.
  # -------------------------------------------------------------------
  ci-gate:
    name: ci-gate
    if: always()
    needs:
      - lint
      - static-analysis
      - security-scan
      - build
      - test
      - coverage-gate
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every CI stage to succeed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          STATIC_ANALYSIS_RESULT: ${{ needs['static-analysis'].result }}
          SECURITY_SCAN_RESULT: ${{ needs['security-scan'].result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_GATE_RESULT: ${{ needs['coverage-gate'].result }}
          DOCKER_BUILD_RESULT: ${{ needs['docker-build'].result }}
        run: |
          fail=0
          report() {
            if [ "$2" != "success" ]; then
              echo "::error::CI stage '$1' did not succeed (result: $2) - the pull request is blocked until it passes"
              fail=1
            fi
          }
          report lint "$LINT_RESULT"
          report static-analysis "$STATIC_ANALYSIS_RESULT"
          report security-scan "$SECURITY_SCAN_RESULT"
          report build "$BUILD_RESULT"
          report test "$TEST_RESULT"
          report coverage-gate "$COVERAGE_GATE_RESULT"
          report docker-build "$DOCKER_BUILD_RESULT"
          exit $fail