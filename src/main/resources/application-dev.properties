# =====================================================================
# DEVELOPMENT PROFILE
# Activate with: -Dspring.profiles.active=dev
# Or set: SPRING_PROFILES_ACTIVE=dev
# =====================================================================

# ---------------------------------------------------------------------
# DATABASE: MySQL
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# DATABASE SCHEMA MANAGEMENT AND SEED DATA
# Validate the existing schema and initialize configured seed data.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------------------------------------------------
# LOGGING: DEVELOPMENT
# Verbose logging is enabled for local debugging.
# Do not enable SQL parameter logging when sensitive data may be present.
# ---------------------------------------------------------------------
spring.jpa.show-sql=true
logging.level.com.onecare.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ---------------------------------------------------------------------
# API DOCUMENTATION: ENABLED IN DEVELOPMENT
# ---------------------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ---------------------------------------------------------------------
# AUTHENTICATION: JWT
# Supply JWT_SECRET through the development environment.
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000

# ---------------------------------------------------------------------
# PASSWORD RESET
# ---------------------------------------------------------------------
password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

# ---------------------------------------------------------------------
# EMAIL SERVICE: SMTP
# Local development defaults can be overridden using environment variables.
# Never commit SMTP credentials to source control.
# ---------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------
# AUTHENTICATION API: RATE LIMITING
# Applies to /api/auth/*.
# ---------------------------------------------------------------------
auth.rate-limit.enabled=true
auth.rate-limit.requests-per-minute=10
auth.rate-limit.window-seconds=60

# ---------------------------------------------------------------------
# PUBLIC BOOKING API: RATE LIMITING
# Applies to /api/public/* (DDP-33).
# Configured independently from the authentication rate-limit tier.
# ---------------------------------------------------------------------
public-booking.rate-limit.enabled=true
public-booking.rate-limit.requests-per-minute=5
public-booking.rate-limit.window-seconds=60

# ---------------------------------------------------------------------
# API SECURITY: TRUSTED PROXIES
# Only configured proxy IPs/CIDRs should be trusted.
# ---------------------------------------------------------------------
api.rate-limit.trusted-proxies=${API_RATE_LIMIT_TRUSTED_PROXIES:}

# ---------------------------------------------------------------------
# BILLING: CONSULTATION FEE
# ---------------------------------------------------------------------
billing.consultation-fee=500.00

# ---------------------------------------------------------------------
# APPOINTMENT SCHEDULING: NO-SHOW MANAGEMENT
# Check scheduled appointments every minute.
# Mark no-shows after the configured grace period from appointment start.
# ---------------------------------------------------------------------
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?

# ---------------------------------------------------------------------
# CORS: ALLOWED FRONTEND ORIGINS
# Defaults to the local Vite development server.
# ---------------------------------------------------------------------
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

# ---------------------------------------------------------------------
# CHATBOT SERVICE: PYTHON API PROXY
# ---------------------------------------------------------------------
chatbot.base-url=${CHATBOT_BASE_URL:http://localhost:8000}
chatbot.service-token=${CHATBOT_SERVICE_TOKEN}
chatbot.connect-timeout=5s
chatbot.read-timeout=60s

# ---------------------------------------------------------------------
# CHATBOT API: REQUEST LIMITS
# ---------------------------------------------------------------------
chatbot.api.max-query-chars=${CHATBOT_MAX_QUERY_CHARS:500}
chatbot.api.max-body-bytes=${CHATBOT_MAX_BODY_BYTES:8192}
chatbot.api.rate-limit-per-minute=${CHATBOT_RATE_LIMIT_PER_MINUTE:20}
chatbot.api.max-tracked-clients=${CHATBOT_MAX_TRACKED_CLIENTS:10000}

# ---------------------------------------------------------------------
# CHATBOT SECURITY: TRUSTED PROXIES
# Empty by default; configure trusted proxy IPs/CIDRs when required.
# ---------------------------------------------------------------------
chatbot.api.trusted-proxies=${CHATBOT_TRUSTED_PROXIES:}

# ---------------------------------------------------------------------
# CHATBOT SECURITY: APPROVED URL DOMAINS
# Empty by default; configure explicitly when required.
# ---------------------------------------------------------------------
chatbot.api.url-allowlist=${CHATBOT_URL_ALLOWLIST:}

# ---------------------------------------------------------------------
# CACHE: REDIS
# ---------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------
# ACTUATOR HEALTH ENDPOINT: DEVELOPMENT
# Public endpoint for local and container health checks.
# Expose aggregate and component statuses without diagnostic details.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# ---------------------------------------------------------------------
# SMTP HEALTH INDICATOR
# SMTP is optional; an unavailable SMTP server must not block startup.
# The custom indicator reports DEGRADED instead of DOWN for SMTP failures.
# ---------------------------------------------------------------------
management.health.smtp.connect-timeout-ms=3000
management.health.mail.enabled=false

# ---------------------------------------------------------------------
# BACKUP STORAGE AND ENCRYPTION
# Backups require a valid Base64-encoded 32-byte AES-256 key at runtime.
# Generate a development key with: openssl rand -base64 32
# ---------------------------------------------------------------------
backup.storage-dir=${BACKUP_STORAGE_DIR:./backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY:}

# ---------------------------------------------------------------------
# COLUMN-LEVEL ENCRYPTION
# Reserved for the column-encryption implementation.
# ---------------------------------------------------------------------
encryption.column-key=${COLUMN_ENCRYPTION_KEY:}

# ---------------------------------------------------------------------
# STARTUP VALIDATION: REQUIRED PROPERTIES
# Missing or empty entries abort startup without logging secret values.
# Backup encryption remains optional at startup in development.
# ---------------------------------------------------------------------
config.required-props=jwt.secret,spring.datasource.url,spring.datasource.username,spring.datasource.password