# DEV profile
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Schema + seed data ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Logging: verbose, safe to leave on locally ---
spring.jpa.show-sql=true
logging.level.com.onecare.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# --- Docs open in dev only ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true


# --- JWT  ---
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000

# --- Password reset  ---
password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

# --- SMTP (Spring Mail) - local dev; override via env vars, never commit secrets
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- API rate limiting (/api/auth/*)
auth.rate-limit.enabled=true
auth.rate-limit.requests-per-minute=10
auth.rate-limit.window-seconds=60

# --- Public-booking rate limiting (/api/public/*, DDP-33 — distinct from the auth tier)
public-booking.rate-limit.enabled=true
public-booking.rate-limit.requests-per-minute=5
public-booking.rate-limit.window-seconds=60
api.rate-limit.trusted-proxies=${API_RATE_LIMIT_TRUSTED_PROXIES:}

# --- Billing : consultation charge added to every invoice
billing.consultation-fee=500.00

# Check scheduled appointments every minute; no-shows are marked after
# their individual start time plus this grace period.
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?

# --- CORS: comma-separated frontend origins allowed to call the API ---
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

# --- Python chatbot proxy: full endpoint URL ---
chatbot.base-url=${CHATBOT_BASE_URL:http://localhost:8000}
chatbot.service-token=${CHATBOT_SERVICE_TOKEN}
chatbot.connect-timeout= 5s
chatbot.read-timeout= 60s

# Chatbot API Configuration
chatbot.api.max-query-chars=${CHATBOT_MAX_QUERY_CHARS:500}
chatbot.api.max-body-bytes=${CHATBOT_MAX_BODY_BYTES:8192}
chatbot.api.rate-limit-per-minute=${CHATBOT_RATE_LIMIT_PER_MINUTE:20}
chatbot.api.max-tracked-clients=${CHATBOT_MAX_TRACKED_CLIENTS:10000}

# Security: Trusted proxies (empty by default)
chatbot.api.trusted-proxies=${CHATBOT_TRUSTED_PROXIES:}

# Security: Approved URL domains (empty by default)
chatbot.api.url-allowlist=${CHATBOT_URL_ALLOWLIST:}
# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Health endpoint (/actuator/health, public for compose) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
# SMTP probe timeout (unreachable SMTP => DEGRADED, never blocks startup)
management.health.smtp.connect-timeout-ms=3000
# Spring's built-in mail indicator reports DOWN when SMTP is unreachable,
# which would fail the container healthcheck. The custom smtp indicator
# supersedes it with DEGRADED semantics: SMTP is optional; MySQL/Redis
# alone gate the stack (AC4).
management.health.mail.enabled=false

# --- Encryption keys (SDS 2.5.3) ---
# Base64 32-byte AES-256 key for monthly backups (DDP-31).
# Generate: openssl rand -base64 32
backup.storage-dir=${BACKUP_STORAGE_DIR:./backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY:}
# Column-level encryption key (AES-256). No consumer yet; the property exists
# so the variable can flow through compose/.env until the encrypting module lands.
encryption.column-key=${COLUMN_ENCRYPTION_KEY:}

# --- Fail-fast startup validation ---
# Missing/empty entries abort boot with a message naming the variable (never
# its value), via RequiredConfigEnvironmentPostProcessor.
# Dev stays lenient about BACKUP_ENCRYPTION_KEY: backups fail at run time only.
config.required-props=jwt.secret,spring.datasource.url,spring.datasource.username,spring.datasource.password
