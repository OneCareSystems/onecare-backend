# DEV profile
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Schema + seed data ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Logging: verbose, safe to leave on locally ---
spring.jpa.show-sql=true
logging.level.com.onecare.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# --- Docs open in dev only ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true


# --- JWT  ---
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000

# --- Password reset  ---
password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

# --- SMTP (Spring Mail) - local dev; override via env vars, never commit secrets
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- API rate limiting (/api/auth/*)
auth.rate-limit.enabled=true
auth.rate-limit.requests-per-minute=10
auth.rate-limit.window-seconds=60