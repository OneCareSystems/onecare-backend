# DEV profile
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Schema + seed data ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Logging: verbose, safe to leave on locally ---
spring.jpa.show-sql=true
logging.level.com.onecare.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# --- Docs open in dev only ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true


# --- JWT  ---
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000

# --- Password reset  ---
password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

# --- SMTP (Spring Mail) - local dev; override via env vars, never commit secrets
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- API rate limiting (/api/auth/*)
auth.rate-limit.enabled=true
auth.rate-limit.requests-per-minute=10
auth.rate-limit.window-seconds=60

# --- Public-booking rate limiting (/api/public/*, DDP-33 — distinct from the auth tier)
public-booking.rate-limit.enabled=true
public-booking.rate-limit.requests-per-minute=5
public-booking.rate-limit.window-seconds=60
api.rate-limit.trusted-proxies=${API_RATE_LIMIT_TRUSTED_PROXIES:}

# --- Billing : consultation charge added to every invoice
billing.consultation-fee=500.00

# Check scheduled appointments every minute; no-shows are marked after
# their individual start time plus this grace period.
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?

# --- CORS: comma-separated frontend origins allowed to call the API ---
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:5173}

# --- Python chatbot proxy: full endpoint URL ---
chatbot:
  base-url= ${CHATBOT_BASE_URL:http://localhost:8000}
  service-token= ${CHATBOT_SERVICE_TOKEN}
  connect-timeout= 5s
  read-timeout= 60s
# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
