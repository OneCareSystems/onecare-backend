 #=====================================================================
# PRODUCTION profile
# Run with: -Dspring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20

#--Schema--
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

# --- Logging: quiet by default, shipped to centralized logging per
# SDS 7.4.3 (90-day retention) rather than the console ---
logging.level.root=WARN
logging.level.com.onecare.backend=INFO

# --- Docs closed in production ---
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Force HTTPS-only cookies (matches SDS 6.1.7 token storage rules) ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
