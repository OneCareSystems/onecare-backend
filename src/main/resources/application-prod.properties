spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20

# ---------------------------------------------------------------------
# DATABASE SCHEMA MANAGEMENT
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# APPOINTMENT SCHEDULING: NO-SHOW MANAGEMENT
# Check scheduled appointments every minute.
# Mark no-shows after the configured grace period from appointment start.
# ---------------------------------------------------------------------
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?

# ---------------------------------------------------------------------
# LOGGING: PRODUCTION
# Root logs default to WARN; application logs use INFO.
# Centralized logging retention is managed according to SDS 7.4.3.
# ---------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.onecare.backend=INFO

# ---------------------------------------------------------------------
# API DOCUMENTATION: DISABLED IN PRODUCTION
# ---------------------------------------------------------------------
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# ---------------------------------------------------------------------
# SESSION COOKIE SECURITY
# ---------------------------------------------------------------------
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# ---------------------------------------------------------------------
# CORS: ALLOWED FRONTEND ORIGINS
# Comma-separated frontend origins; required environment variable.
# ---------------------------------------------------------------------
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}

  base-url= ${CHATBOT_BASE_URL}
  service-token= ${CHATBOT_SERVICE_TOKEN}
  connect-timeout= 5s
  read-timeout= 60s

chatbot.base-url=${CHATBOT_BASE_URL:http://localhost:8000}
chatbot.service-token=${CHATBOT_SERVICE_TOKEN}
chatbot.connect-timeout=5s
chatbot.read-timeout=60s

chatbot.api.max-query-chars=${CHATBOT_MAX_QUERY_CHARS:500}
chatbot.api.max-body-bytes=${CHATBOT_MAX_BODY_BYTES:8192}
chatbot.api.rate-limit-per-minute=${CHATBOT_RATE_LIMIT_PER_MINUTE:20}
chatbot.api.max-tracked-clients=${CHATBOT_MAX_TRACKED_CLIENTS:10000}

chatbot.api.trusted-proxies=${CHATBOT_TRUSTED_PROXIES:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:1800000}
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800000}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false

password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

management.health.smtp.connect-timeout-ms=3000
management.health.mail.enabled=false

backup.storage-dir=${BACKUP_STORAGE_DIR:./backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY}
encryption.column-key=${COLUMN_ENCRYPTION_KEY:}

config.required-props=jwt.secret,spring.datasource.url,spring.datasource.username,spring.datasource.password,backup.encryption-key

api.rate-limit.trusted-proxies=${API_RATE_LIMIT_TRUSTED_PROXIES:}