 #=====================================================================
# PRODUCTION profile
# Run with: -Dspring.profiles.active=prod  (or SPRING_PROFILES_ACTIVE=prod)
# =====================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=20

#--Schema--
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

# Check scheduled appointments every minute; no-shows are marked after
# their individual start time plus this grace period.
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?

# --- Logging: quiet by default, shipped to centralized logging per
# SDS 7.4.3 (90-day retention) rather than the console ---
logging.level.root=WARN
logging.level.com.onecare.backend=INFO

# --- Docs closed in production ---
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# --- Force HTTPS-only cookies (matches SDS 6.1.7 token storage rules) ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# --- CORS: comma-separated frontend origins; required env var ---
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}

# --- Python chatbot proxy: full endpoint URL; required env var ---
chatbot.url=${CHATBOT_URL}
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=15s
# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT ---
# No default on purpose: production must never boot on a fallback secret (AC3).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:1800000}
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800000}

# --- SMTP---
# Optional at startup: an unreachable or unset SMTP gateway must NOT stop the
# stack. The smtp health indicator reports DEGRADED instead of DOWN.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false

# --- Password reset ---
password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

# --- Health endpoint (/actuator/health, public for compose/LB probes) ---
# Details stay on: only status + component states are exposed over HTTP, and
# ops need the degraded component named. Backend port is loopback-only in prod.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.smtp.connect-timeout-ms=3000
# Spring's built-in mail indicator reports DOWN when SMTP is unreachable,
# which would fail the container healthcheck. The custom smtp indicator
# supersedes it with DEGRADED semantics: SMTP is optional; MySQL/Redis
# alone gate the stack.
management.health.mail.enabled=false

# --- Encryption keys (SDS 2.5.3) ---
# Base64 32-byte AES-256-GCM key for backups (DDP-31). Required in production:
# an unencrypted backup would be a security incident, so fail at boot instead.
backup.storage-dir=${BACKUP_STORAGE_DIR:./backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY}
encryption.column-key=${COLUMN_ENCRYPTION_KEY:}

# --- Fail-fast startup validation (AC3) ---
# Missing/empty entries abort boot naming the variable, never its value.
config.required-props=jwt.secret,spring.datasource.url,spring.datasource.username,spring.datasource.password,backup.encryption-key

# Only configured proxy IPs/CIDRs may supply X-Forwarded-For.
api.rate-limit.trusted-proxies=${API_RATE_LIMIT_TRUSTED_PROXIES:}
