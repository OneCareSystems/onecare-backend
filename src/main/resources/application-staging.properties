# ======
# STAGING profile
# Run with: -Dspring.profiles.active=staging  (or SPRING_PROFILES_ACTIVE=staging)
# =======

# --- Datasource: same pattern as dev, pointed at the staging DB by
# whatever values the staging environment injects for these three
# variables. No secrets live in this file (AC2 / AC3)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Schema ---
# validate: the schema must already match the entities (created via
# migration / a one-off deploy step). Staging never auto-generates or
# drops tables — that would destroy the QA/UAT test data described in
# SDS 7.4.2.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

# Check scheduled appointments every minute; no-shows are marked after
# their individual start time plus this grace period.
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?

# --- Logging ---
logging.level.com.onecare.backend=INFO
logging.level.org.hibernate.SQL=WARN

# --- Docs available for QA, not indexed publicly ---
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# --- CORS: comma-separated frontend origins; required env var ---
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}

# --- Python chatbot proxy: full endpoint URL; required env var ---
chatbot.base-url=${CHATBOT_BASE_URL:http://localhost:8000}
chatbot.service-token=${CHATBOT_SERVICE_TOKEN}
chatbot.connect-timeout= 5s
chatbot.read-timeout= 60s

# Chatbot API Configuration
chatbot.api.max-query-chars=${CHATBOT_MAX_QUERY_CHARS:500}
chatbot.api.max-body-bytes=${CHATBOT_MAX_BODY_BYTES:8192}
chatbot.api.rate-limit-per-minute=${CHATBOT_RATE_LIMIT_PER_MINUTE:20}
chatbot.api.max-tracked-clients=${CHATBOT_MAX_TRACKED_CLIENTS:10000}

# Security: Trusted proxies (empty by default)
chatbot.api.trusted-proxies=${CHATBOT_TRUSTED_PROXIES:}

# Security: Approved URL domains (empty by default)
chatbot.api.url-allowlist=${CHATBOT_URL_ALLOWLIST:}

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT ---
# No default on purpose: staging must never boot on a fallback secret (AC3).
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:1800000}
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800000}

# --- SMTP (DDP-16) ---
# Optional at startup: an unreachable or unset SMTP gateway must NOT stop the
# stack (AC4). The smtp health indicator reports DEGRADED instead of DOWN.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false

# --- Password reset ---
password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

# --- Health endpoint (DDP-#49: /actuator/health, public for compose/LB probes) ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.smtp.connect-timeout-ms=3000
# Spring's built-in mail indicator reports DOWN when SMTP is unreachable,
# which would fail the container healthcheck. The custom smtp indicator
# supersedes it with DEGRADED semantics: SMTP is optional; MySQL/Redis
# alone gate the stack (AC4).
management.health.mail.enabled=false

# --- Encryption keys (SDS 2.5.3) ---
# Base64 32-byte AES-256-GCM key for backups (DDP-31). Required in staging:
# an unencrypted backup would be a security incident, so fail at boot instead.
backup.storage-dir=${BACKUP_STORAGE_DIR:./backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY}
encryption.column-key=${COLUMN_ENCRYPTION_KEY:}

# --- Fail-fast startup validation (AC3) ---
# Missing/empty entries abort boot naming the variable, never its value.
config.required-props=jwt.secret,spring.datasource.url,spring.datasource.username,spring.datasource.password,backup.encryption-key

# Only configured proxy IPs/CIDRs may supply X-Forwarded-For.
api.rate-limit.trusted-proxies=${API_RATE_LIMIT_TRUSTED_PROXIES:}
