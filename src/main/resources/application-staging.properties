# =====================================================================
# STAGING PROFILE
# Activate with: -Dspring.profiles.active=staging
# Or set: SPRING_PROFILES_ACTIVE=staging
# =====================================================================

# ---------------------------------------------------------------------
# DATABASE: MySQL
# Credentials and connection details are supplied by the staging environment.
# No secrets should be committed to source control.
# ---------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# DATABASE SCHEMA MANAGEMENT
# Validate the schema created by migrations or a deployment step.
# Staging must not automatically create, update, or drop tables.
# ---------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false

# ---------------------------------------------------------------------
# APPOINTMENT SCHEDULING: NO-SHOW MANAGEMENT
# Check scheduled appointments every minute.
# Mark no-shows after the configured grace period from appointment start.
# ---------------------------------------------------------------------
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?

# ---------------------------------------------------------------------
# LOGGING: STAGING
# Keep application logs informative without verbose SQL output.
# ---------------------------------------------------------------------
logging.level.com.onecare.backend=INFO
logging.level.org.hibernate.SQL=WARN

# ---------------------------------------------------------------------
# API DOCUMENTATION: ENABLED FOR QA
# Restrict access to authorized QA users at the network or security layer.
# ---------------------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# ---------------------------------------------------------------------
# CORS: ALLOWED FRONTEND ORIGINS
# Comma-separated frontend origins; required environment variable.
# ---------------------------------------------------------------------
frontend.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}

 base-url= ${CHATBOT_BASE_URL}
  service-token= ${CHATBOT_SERVICE_TOKEN}
  connect-timeout= 5s
  read-timeout= 60s

chatbot.base-url=${CHATBOT_BASE_URL:http://localhost:8000}
chatbot.service-token=${CHATBOT_SERVICE_TOKEN}
chatbot.connect-timeout=5s
chatbot.read-timeout=60s

# ---------------------------------------------------------------------
# CHATBOT API: REQUEST LIMITS
# ---------------------------------------------------------------------
chatbot.api.max-query-chars=${CHATBOT_MAX_QUERY_CHARS:500}
chatbot.api.max-body-bytes=${CHATBOT_MAX_BODY_BYTES:8192}
chatbot.api.rate-limit-per-minute=${CHATBOT_RATE_LIMIT_PER_MINUTE:20}
chatbot.api.max-tracked-clients=${CHATBOT_MAX_TRACKED_CLIENTS:10000}

# ---------------------------------------------------------------------
# CHATBOT SECURITY: TRUSTED PROXIES
# Empty by default; configure trusted proxy IPs/CIDRs when required.
# ---------------------------------------------------------------------
chatbot.api.trusted-proxies=${CHATBOT_TRUSTED_PROXIES:}

# ---------------------------------------------------------------------
# CHATBOT SECURITY: APPROVED URL DOMAINS
# Empty by default; configure explicitly when required.
# ---------------------------------------------------------------------
chatbot.api.url-allowlist=${CHATBOT_URL_ALLOWLIST:}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ---------------------------------------------------------------------
# AUTHENTICATION: JWT
# No default secret is permitted in staging.
# ---------------------------------------------------------------------
jwt.secret=${JWT_SECRET}
jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:1800000}
jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800000}

# ---------------------------------------------------------------------
# EMAIL SERVICE: SMTP (DDP-16)
# SMTP is optional at startup. An unavailable SMTP server must not prevent
# the application from starting. The custom health indicator reports
# DEGRADED when SMTP is unavailable.
# ---------------------------------------------------------------------
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=false

# ---------------------------------------------------------------------
# PASSWORD RESET
# ---------------------------------------------------------------------
password-reset.token-expiration-minutes=30
password-reset.frontend-base-url=${FRONTEND_URL}

# ---------------------------------------------------------------------
# ACTUATOR HEALTH ENDPOINT: STAGING SECURITY (DDP-#49)
# Public endpoint for load balancer and container health checks.
# Expose aggregate and component statuses without diagnostic details.
# ---------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=always

# ---------------------------------------------------------------------
# SMTP HEALTH INDICATOR
# SMTP failures must not prevent application startup.
# Use the custom SMTP indicator instead of Spring Boot's default mail
# health indicator to preserve DEGRADED semantics.
# ---------------------------------------------------------------------
management.health.smtp.connect-timeout-ms=3000
management.health.mail.enabled=false

# ---------------------------------------------------------------------
# BACKUP STORAGE AND ENCRYPTION
# A Base64-encoded 32-byte AES-256-GCM key is required in staging.
# ---------------------------------------------------------------------
backup.storage-dir=${BACKUP_STORAGE_DIR:./backups}
backup.encryption-key=${BACKUP_ENCRYPTION_KEY}
encryption.column-key=${COLUMN_ENCRYPTION_KEY:}

# ---------------------------------------------------------------------
# STARTUP VALIDATION: REQUIRED PROPERTIES
# Missing or empty entries abort startup without logging secret values.
# ---------------------------------------------------------------------
config.required-props=jwt.secret,spring.datasource.url,spring.datasource.username,spring.datasource.password,backup.encryption-key

# ---------------------------------------------------------------------
# RATE LIMITING SECURITY: TRUSTED PROXIES
# Only configured proxy IPs/CIDRs may supply X-Forwarded-For.
# ---------------------------------------------------------------------
api.rate-limit.trusted-proxies=${API_RATE_LIMIT_TRUSTED_PROXIES:}