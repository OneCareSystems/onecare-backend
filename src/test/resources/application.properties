@Value("${app.security.argon2.iterations:2}")
String argon2Iterations
spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:onecare-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=never

jwt.secret=bXktdGVzdC1zZWNyZXQtbXktdGVzdC1zZWNyZXQtbXktdGVzdC1zZWNyZXQ
password-reset.token-expiration-minutes=15
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000
password-reset.frontend-base-url=http://localhost:5173

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:test}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}


# Billing 
billing.consultation-fee=500.00

# Clinic Operating Hours and Scheduler Config
# Default booking window for doctors without a configured schedule: 4 PM - 9 PM
clinic.operating-hours.start-time=16:00
clinic.operating-hours.end-time=21:00
clinic.operating-hours.slot-duration-minutes=30
clinic.noshow.grace-period-minutes=15
clinic.noshow.cron=0 * * * * ?
# Fast Argon2 for tests (production default: 65536 KB memory, 2 iterations).
# Every integration test method creates 3 users + performs 3 logins, so the
# production cost (~650 ms per hash/verify) would dominate suite runtime.
app.security.argon2.memory-kb=8192
app.security.argon2.iterations=1

# CORS
frontend.allowed-origins=http://localhost:5173,https://app.example.com

# Python chatbot proxy
# Chatbot service configuration
chatbot.base-url=http://localhost:8000
chatbot.service-token=test-chatbot-service-token
chatbot.connect-timeout=5s
chatbot.read-timeout=60s



# Chatbot API configuration
chatbot.api.max-query-chars=500
chatbot.api.max-body-bytes=8192
chatbot.api.rate-limit-per-minute=20
chatbot.api.max-tracked-clients=10000

# Security settings for tests
chatbot.api.trusted-proxies=
chatbot.api.url-allowlist=


spring.data.redis.host=localhost
spring.data.redis.port=6379
# System backup & restore (FR010, UC5)
backup.storage-dir=${java.io.tmpdir}/onecare-test-backups
# base64 of the 32 ASCII bytes "0123456789abcdef0123456789abcdef"
backup.encryption-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
