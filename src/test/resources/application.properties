spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:onecare-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=never

jwt.secret=bXktdGVzdC1zZWNyZXQtbXktdGVzdC1zZWNyZXQtbXktdGVzdC1zZWNyZXQ
password-reset.token-expiration-minutes=15
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000
password-reset.frontend-base-url=http://localhost:5173

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:2525}
spring.mail.username=${SPRING_MAIL_USERNAME:test}
spring.mail.password=${SPRING_MAIL_PASSWORD:test}

