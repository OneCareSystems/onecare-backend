spring.application.name=backend-test

spring.datasource.url=jdbc:h2:mem:onecaretest;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.sql.init.mode=never

jwt.secret=bXktdGVzdC1zZWNyZXQtbXktdGVzdC1zZWNyZXQtbXktdGVzdC1zZWNyZXQ=
jwt.access-token-expiry=1800000
jwt.refresh-token-expiry=604800000